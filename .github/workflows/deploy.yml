name: Build and Test

on: push

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build, unit tests and integration tests
        run: ./mvnw -B clean package

      - name: Code vulnerability scanning
        uses: anchore/scan-action@v7
        id: scan
        with:
          path: "${{ github.workspace }}"
          output-format: sarif
          output-file: results.sarif
          fail-build: false
          severity-cutoff: high


      - name: Validate vulnerability report
        id: sarif
        if: always() && steps.scan.outcome != 'skipped'
        run: |
          if [ -s results.sarif ] && python3 -c "import json,sys; json.load(open('results.sarif'))" 2>/dev/null; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Vulnerability scan::Scan produced no valid SARIF report; skipping upload."
          fi

      - name: Upload vulnerability report
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.sarif.outputs.valid == 'true'
        with:
          sarif_file: results.sarif
